name: Security

on:
  push:
  pull_request:
  schedule:
    # Weekly, catches newly disclosed advisories against pinned deps even
    # when no code changes.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  audit-backend:
    name: npm audit (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high + critical)
        run: npm audit --audit-level=high

  audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit (high + critical)
        run: npm audit --audit-level=high

  secret-scan:
    name: Leaked secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Runs from the repo root so it covers both backend/ and frontend/ in
      # a single pass. Excludes node_modules, dist, .git, *.db, *.enc.json,
      # *.bak — see backend/scripts/scan-secrets.js for the full pattern
      # list (GitHub/GitLab/Slack tokens, AWS access keys, PEM private keys).
      - name: Scan for leaked credentials
        run: node backend/scripts/scan-secrets.js .
